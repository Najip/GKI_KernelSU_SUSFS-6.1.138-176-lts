name: Sync custom main workflow

# Rebuilds main-6.1.x-kernelsupin-nods.yml from the current main.yml already
# merged into this branch (the user updates main.yml after pulling upstream),
# then re-applies the fork customisations (.github/scripts/apply_custom_main.py).
# - Uses the local .github/workflows/main.yml as the source (already merged
#   from upstream by the user).
# - Backs up the previous custom workflow to main-6.1.x-kernelsupin-nods.yml.bak
#   (deleting any older backup first).
# - Renames the freshly patched copy to the custom workflow name.
# - Skips entirely if main.yml is byte-identical to the last synced copy
#   (tracked via .github/.custom-main-sync.sha).
# - Manual trigger only (no scheduled/cron runs).
# Branch: main.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-custom-main
  cancel-in-progress: false

env:
  TARGET_BRANCH: main
  SOURCE_FILE: .github/workflows/main.yml
  OUT_FILE: .github/workflows/main-6.1.x-kernelsupin-nods.yml
  BACKUP_FILE: .github/workflows/main-6.1.x-kernelsupin-nods.yml.bak
  STATE_FILE: .github/.custom-main-sync.sha

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.WORKFLOW_PAT || github.token }}

      - name: Compute source main.yml SHA
        id: sha
        run: |
          set -euo pipefail
          sha256sum "$SOURCE_FILE" | awk '{print $1}' > "$RUNNER_TEMP/source.sha"
          echo "Source main.yml sha: $(cat "$RUNNER_TEMP/source.sha")"

      - name: Skip if main.yml unchanged
        id: skip
        run: |
          set -euo pipefail
          SRC_SHA="$(cat "$RUNNER_TEMP/source.sha")"
          if [ -f "$STATE_FILE" ] && [ "$(cat "$STATE_FILE")" = "$SRC_SHA" ]; then
            echo "main.yml unchanged (sha $SRC_SHA). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Backup old custom workflow and apply patch
        if: steps.skip.outputs.skip == 'false'
        run: |
          set -euo pipefail
          if [ -f "$OUT_FILE" ]; then
            rm -f "$BACKUP_FILE"
            cp "$OUT_FILE" "$BACKUP_FILE"
          fi
          python3 .github/scripts/apply_custom_main.py "$SOURCE_FILE" "$OUT_FILE"

      - name: Validate YAML
        if: steps.skip.outputs.skip == 'false'
        run: python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$OUT_FILE"

      - name: Commit if changed
        if: steps.skip.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_FILE" "$BACKUP_FILE" 2>/dev/null || git add "$OUT_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "ci: resync main-6.1.x-kernelsupin-nods.yml from local main.yml (backup old custom)"
          fi
          mkdir -p "$(dirname "$STATE_FILE")"
          cp "$RUNNER_TEMP/source.sha" "$STATE_FILE"
          git add "$STATE_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "ci: update main.yml sync state"
          fi
          git push origin "HEAD:${TARGET_BRANCH}"
