name: 'Download Kernel Repository'
description: 'Initialize and sync Android kernel source repository'
inputs:
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 5.15, 6.1)'
    required: true
  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true
  os_patch_level:
    description: 'OS patch level (e.g. 2024-01)'
    required: true
outputs:
  deprecated_branch:
    description: 'Whether the kernel branch is deprecated'
    value: ${{ steps.sync.outputs.deprecated }}
  tag_fallback:
    description: 'Release tag used when the branch head was missing upstream'
    value: ${{ steps.sync.outputs.tag_fallback }}
runs:
  using: composite
  steps:
    - name: Initialize and Sync Kernel Repository
      id: sync
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      env:
        CACHE_INPUT_VERSION: ${{ inputs.version }}
        CACHE_INPUT_PATCH: ${{ inputs.os_patch_level }}
      run: |
        set -euo pipefail
        export SOURCE_CACHE_TARGET="${CACHE_INPUT_VERSION}:${CACHE_INPUT_PATCH}"
        kernel_cache() {
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] || return 0
          python3 - "$1" <<'PY'
        import fcntl, hashlib, json, os, shutil, subprocess, sys, tempfile
        from pathlib import Path
        LIMIT = 3 * 1024**3
        RESERVE = 8 * 1024**3
        mode = sys.argv[1]
        workspace = Path.cwd()
        objects = workspace / '.repo/project-objects'
        root = Path.home() / '.cache/gki-kernel/source-objects-v1'
        target = os.environ['SOURCE_CACHE_TARGET']
        def note(message):
            print('Source cache: ' + message, flush=True)
        def size(path):
            return sum(p.stat().st_size for p in path.rglob('*') if p.is_file() and not p.is_symlink())
        def host_free():
            kernel = Path('/proc/sys/kernel/osrelease').read_text().lower()
            if 'microsoft' not in kernel:
                return shutil.disk_usage(root).free
            distro = os.environ.get('WSL_DISTRO_NAME', '')
            if not distro or not shutil.which('powershell.exe'):
                raise RuntimeError('cannot verify Windows backing-drive space; skipping cache')
            ps = r'''$ErrorActionPreference='Stop'; $n=[Console]::In.ReadToEnd().Trim(); $d=Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss' | Get-ItemProperty | Where-Object { $_.DistributionName -eq $n }; if (@($d).Count -ne 1) { throw 'Distribution not found' }; $m=[regex]::Match($d.BasePath, '(?i)([a-z]):\\'); if (!$m.Success) { throw 'Backing drive not found' }; [Console]::Write((Get-PSDrive $m.Groups[1].Value).Free)'''
            result = subprocess.run(['powershell.exe', '-NoProfile', '-NonInteractive', '-Command', ps], input=distro, text=True, capture_output=True, timeout=30, check=True)
            return int(result.stdout.strip())
        def room(required):
            return min(host_free(), shutil.disk_usage(root).free) >= required + RESERVE
        def ignore(directory, names):
            return [n for n in names if n == 'hooks' or n.endswith('.lock') or n == 'gc.log']
        stage = None
        created = False
        try:
            root.mkdir(parents=True, exist_ok=True, mode=0o700)
            with (root / '.lock').open('a') as lock:
                fcntl.flock(lock, fcntl.LOCK_EX)
                current, old = root / 'current', root / 'old'
                if old.exists() and not current.exists():
                    old.rename(current)
                elif old.exists():
                    shutil.rmtree(old)
                for orphan in root.glob('stage-*'):
                    if orphan.is_dir() and not orphan.is_symlink():
                        shutil.rmtree(orphan)
                if mode == 'restore':
                    metadata = current / 'metadata.json'
                    if not metadata.is_file():
                        note('MISS; downloading normally')
                    else:
                        data = json.loads(metadata.read_text())
                        saved = current / 'project-objects'
                        if data.get('target') != target or not saved.is_dir():
                            note('MISS for this target; downloading normally')
                        elif objects.exists():
                            note('workspace object store already exists; leaving it unchanged')
                        else:
                            amount = size(saved)
                            if amount > LIMIT or not room(amount):
                                note('restore skipped by size/free-space guard')
                            else:
                                objects.parent.mkdir(parents=True, exist_ok=True)
                                created = True
                                shutil.copytree(saved, objects, symlinks=True, ignore=ignore)
                                note(f'HIT; seeded {amount // 1024**2} MiB; repo sync still checks revisions')
                elif mode == 'save':
                    if not objects.is_dir():
                        note('no project object store to save')
                    elif any(p.stat().st_size for p in objects.glob('**/objects/info/alternates') if p.is_file()):
                        note('external object alternates detected; not saving a dependent cache')
                    else:
                        amount = size(objects)
                        if amount > LIMIT or not room(amount):
                            note(f'save skipped; {amount // 1024**2} MiB, 3072 MiB cap and 8192 MiB reserve')
                        else:
                            manifest = subprocess.check_output(['repo', 'manifest', '-r'], text=True)
                            digest = hashlib.sha256(manifest.encode()).hexdigest()
                            data = json.loads((current / 'metadata.json').read_text()) if (current / 'metadata.json').exists() else {}
                            if data.get('target') == target and data.get('manifest') == digest:
                                note('resolved manifest unchanged; existing snapshot retained')
                            else:
                                stage = Path(tempfile.mkdtemp(prefix='stage-', dir=root))
                                shutil.copytree(objects, stage / 'project-objects', symlinks=True, ignore=ignore)
                                if size(stage) > LIMIT:
                                    raise RuntimeError('cache exceeded budget during copying')
                                (stage / 'metadata.json').write_text(json.dumps({'target': target, 'manifest': digest}))
                                if current.exists():
                                    current.rename(old)
                                stage.rename(current)
                                stage = None
                                if old.exists():
                                    shutil.rmtree(old)
                                note(f'saved {amount // 1024**2} MiB; one target snapshot retained')
                else:
                    raise ValueError('Unknown cache operation')
        except Exception as exc:
            if mode == 'restore' and created and objects.exists():
                shutil.rmtree(objects)
            note(f'optional cache unavailable: {exc}')
        finally:
            if stage is not None and stage.exists():
                shutil.rmtree(stage)
        PY
        }
        kernel_cache restore
        VERSION="${{ inputs.version }}"
        ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
        KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)
        FORMATTED_BRANCH="${ANDROID_PART}-${KERNEL_PART}-${{ inputs.os_patch_level }}"
        init_repo() {
          local depth="$1"
          local depth_flag=""
          if [ "$depth" != "0" ]; then
            depth_flag="--depth=${depth}"
          fi
          repo init -u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} ${depth_flag} || { echo "ERROR: repo init failed" >&2; return 1; }
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH}) || { echo "ERROR: git ls-remote failed" >&2; return 1; }
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          DEPRECATED=false
          if grep -q deprecated <<< "$REMOTE_BRANCH"; then
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" "$DEFAULT_MANIFEST_PATH"
            echo "[!] Note: Branch ${FORMATTED_BRANCH} is considered deprecated."
            DEPRECATED=true
          fi
          echo "deprecated=$DEPRECATED" >> $GITHUB_OUTPUT
          TAG_FALLBACK=""
          if [ "$DEPRECATED" = "false" ] && [ -z "$REMOTE_BRANCH" ]; then
            LATEST_TAG=$(git ls-remote https://android.googlesource.com/kernel/common "refs/tags/${FORMATTED_BRANCH}_r*" 2>/dev/null | awk '{print $2}' | grep -v '\^{}$' | sed 's|refs/tags/||' | awk -F'_r' '{print $NF+0, $0}' | sort -n | tail -n 1 | cut -d' ' -f2- || true)
            if [ -n "$LATEST_TAG" ]; then
              echo "[!] Note: Branch ${FORMATTED_BRANCH} head missing upstream; using tag ${LATEST_TAG}."
              sed -i "/path=\"common\"/ s|revision=\"${FORMATTED_BRANCH}\"|revision=\"refs/tags/${LATEST_TAG}\"|" "$DEFAULT_MANIFEST_PATH"
              TAG_FALLBACK="$LATEST_TAG"
            else
              echo "WARNING: no head or tag found for ${FORMATTED_BRANCH}; sync will likely fail." >&2
            fi
          fi
          echo "tag_fallback=$TAG_FALLBACK" >> $GITHUB_OUTPUT
        }
        MAX_RETRIES=5
        SYNC_TIMEOUT="15m"
        RETRY_DELAYS=(15 30 60 120 240)
        REPO_SYNC_JOBS="${REPO_SYNC_JOBS:-16}"
        REPO_CHECKOUT_JOBS="${REPO_CHECKOUT_JOBS:-$(nproc)}"
        attempt=1
        DEPTHS=(1 1 1 1 1)
        export GIT_CONFIG_COUNT=2
        export GIT_CONFIG_KEY_0=http.lowSpeedLimit
        export GIT_CONFIG_VALUE_0=1024
        export GIT_CONFIG_KEY_1=http.lowSpeedTime
        export GIT_CONFIG_VALUE_1=60
        clean_workspace() {
          echo "Disk before cleanup:"
          df -h "$PWD" | tail -n +2 || true
          find "$PWD" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          echo "Disk after cleanup:"
          df -h "$PWD" | tail -n +2 || true
        }
        while [ $attempt -le $MAX_RETRIES ]; do
          CURRENT_DEPTH="${DEPTHS[$((attempt-1))]}"
          echo "Attempt $attempt/$MAX_RETRIES: initialize and sync kernel repository (depth=${CURRENT_DEPTH}, sync timeout $SYNC_TIMEOUT, stall abort: <1KB/s for 60s)..."
          df -h "$PWD" | tail -n +2 || true
          if init_repo "$CURRENT_DEPTH"; then
            SYNC_TAG_FLAGS="--no-tags"
            if [ -n "$TAG_FALLBACK" ]; then SYNC_TAG_FLAGS=""; fi
            PROJECT_COUNT=$(grep -c '<project' "$DEFAULT_MANIFEST_PATH" 2>/dev/null || true)
            echo "[*] repo sync: ${PROJECT_COUNT:-?} project(s), -j${REPO_SYNC_JOBS}, --jobs-checkout=${REPO_CHECKOUT_JOBS}"
            SYNC_START=$(date +%s)
            if timeout $SYNC_TIMEOUT repo sync -c --current-branch --no-clone-bundle $SYNC_TAG_FLAGS --jobs-checkout="${REPO_CHECKOUT_JOBS}" -j"${REPO_SYNC_JOBS}"; then
              echo "Kernel repository initialization and sync succeeded on attempt $attempt in $(( $(date +%s) - SYNC_START ))s."
              kernel_cache save
              break
            else
              rc=$?
              if [ $rc -eq 124 ]; then
                echo "repo sync timed out after $SYNC_TIMEOUT (no stall-abort fired: transfer was progressing, just slow)."
              else
                echo "repo sync failed with exit code $rc."
              fi
            fi
          else
            rc=$?
            echo "repo init or branch preflight failed with exit code $rc."
          fi
          if [ $attempt -lt $MAX_RETRIES ]; then
            DELAY="${RETRY_DELAYS[$((attempt-1))]}"
            echo "Cleaning workspace and retrying after ${DELAY}s..."
            clean_workspace || true
            sleep "$DELAY"
          else
            echo "All $MAX_RETRIES attempts failed." >&2
            exit $rc
          fi
          attempt=$((attempt+1))
        done
    - name: Capture Kernel Common Commit Metadata
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        if [[ ! -d common ]]; then
          echo "WARNING: common folder not found; skipping commit metadata capture."
          exit 0
        fi
        cd common
        if [[ ! -d .git ]]; then
          echo "WARNING: common is not a git checkout; skipping commit metadata capture."
          exit 0
        fi
        COMMIT_DATE=$(git log -1 --format=%cI)
        COMMIT_MSG=$(git log -1 --format=%s)
        COMMIT_SHA=$(git rev-parse HEAD)
        echo "KERNEL_SOURCE_COMMIT=$COMMIT_SHA" >> "$GITHUB_ENV"
        echo "Kernel common commit date: $COMMIT_DATE"
        echo "Kernel common commit msg: $COMMIT_MSG"
        echo "Kernel common commit SHA: $COMMIT_SHA"
