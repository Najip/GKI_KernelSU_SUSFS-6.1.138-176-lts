name: Download Kernel Repository
description: Initialize and sync Android kernel sources with persistent self-hosted caching
# GKI_SOURCE_CACHE: preserve this action across upstream resets.
inputs:
  android_version:
    description: Android version
    required: true
  kernel_version:
    description: Kernel version
    required: true
  version:
    description: Combined Android-kernel version
    required: true
  os_patch_level:
    description: OS patch level
    required: true
outputs:
  deprecated_branch:
    description: Whether the branch is deprecated
    value: ${{ steps.sync.outputs.deprecated }}
  tag_fallback:
    description: Release tag used when the branch head is missing
    value: ${{ steps.sync.outputs.tag_fallback }}
runs:
  using: composite
  steps:
    - name: Initialize and Sync Kernel Repository
      id: sync
      shell: bash
      env:
        SOURCE_VERSION: ${{ inputs.version }}
        SOURCE_PATCH_LEVEL: ${{ inputs.os_patch_level }}
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/kernel"
        bash "${GITHUB_WORKSPACE}/.github/scripts/kernel_source_cache.sh"
